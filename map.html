
<!DOCTYPE html>
<html charset="UTF-8">
<head>
<title>Gloryhammer Map</title>
<link rel="stylesheet" href="leaflet.js/leaflet/dist/leaflet.css" />
<script src="leaflet.js/leaflet/dist/leaflet.js"></script>
<script>

</script>
<style>
#map {height: 640px; width: 1150px;
    margin: 20px; border-radius: 20px;
    box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19);
}

#row {
    display: flex;
}

#column-left {flex: 3;
    
}

#column-right {flex: 1;
    background-color: #f3f3f3; margin: 20px; border-radius: 20px;
    box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19);
}

#bottom {
    height: 150px; border-radius: 20px; margin-top: 10px; margin-left: 20px; margin-right: 20px;
    box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19);
}

#player {
    margin: 20px;
}

</style>
</head>
<body>
    <div id="row">
        <div id="column-left">
            <div id="map"></div>
                <script>
                    var map = L.map('map').setView([56.4605938, -2.9701900], 13);
                    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
                    }).addTo(map);

                    var Dundee = L.marker([56.4605938, -2.9701900]).addTo(map);
                    var Crail = L.marker([56.2598, -2.6257]).addTo(map);
                    var Aberdeen = L.marker([57.1452, -2.0984]).addTo(map);
                    var Auchtermuchty = L.marker([56.2920848, -3.2328277]).addTo(map);
                    var Inverness = L.marker([57.4790124, -4.2257390]).addTo(map);

                    Dundee.bindPopup("Dundee").openPopup();
                    Crail.bindPopup("Crail");
                    Aberdeen.bindPopup("Aberdeen");
                    Auchtermuchty.bindPopup("Auchtermuchty");
                    Inverness.bindPopup("Inverness");
                </script>

        </div>
        <div id="column-right">
            <p>Test</p>
        </div>
    </div>
    <div id="bottom">
        <div id="player">
            <p>Test</p>
        </div>
    </div>
</body>
</html>
